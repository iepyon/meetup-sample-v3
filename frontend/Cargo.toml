[package]
name = "meetup-frontend"
version.workspace = true
edition.workspace = true

[dependencies]
console_error_panic_hook = "0.1.7"
gloo-net = { version = "0.8.0", default-features = false, features = ["http", "json"] }
js-sys = "0.3.107"
leptos = { version = "0.8.23", features = ["csr"] }
leptos_router = "0.8.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "=0.2.130"  # Dockerfile の wasm-bindgen-cli と揃えるため完全一致で固定
web-sys = { version = "0.3.107", features = ["Window", "Storage", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "SubmitEvent", "Event"] }

[dev-dependencies]
meetup-test-macros = { path = "../test-macros" }
