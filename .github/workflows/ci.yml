name: CI

# public リポジトリ（GitHub Actions の標準ランナーは無料）。ただし実行時間とランナーの待ちを抑えるため: docs のみの変更は skip / 古い実行は concurrency で自動キャンセル /
# 重い E2E は pull_request のときだけ実行する。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format / Lint / Test (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # トークンを .git/config に残さない（後続ステップから参照されないように）
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Cargo.lock と食い違う依存解決を最初に止める（後続の --locked 無しのコマンドに lock を書き換えさせない）
      - name: Fetch dependencies (locked)
        run: cargo fetch --locked

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint (backend + native targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Lint (frontend / wasm32)
        run: cargo clippy -p meetup-frontend --target wasm32-unknown-unknown -- -D warnings

      # backend の単体・HTTP 統合テスト（インメモリ SQLite）と frontend の純粋関数テスト
      - name: Test
        run: cargo test --workspace --locked

  e2e:
    name: E2E (Rust / chromiumoxide)
    # 分数節約のため PR のときだけ実行する
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # トークンを .git/config に残さない（後続ステップから参照されないように）
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Cargo.lock と食い違う依存解決を最初に止める（後続の --locked 無しのコマンドに lock を書き換えさせない）
      - name: Fetch dependencies (locked)
        run: cargo fetch --locked

      - name: Install trunk
        run: cargo install trunk --locked --version 0.22.2

      # E2E は backend を同一プロセスで起動し、ビルド済み SPA を同一オリジンで配信する
      - name: Build SPA for E2E
        run: trunk build --dist ../target/e2e-dist
        working-directory: frontend

      # ブラウザはランナーにプリインストールの Google Chrome を使う
      - name: Run E2E tests
        run: cargo test -p meetup-e2e --locked -- --ignored
        env:
          CHROME: /usr/bin/google-chrome
