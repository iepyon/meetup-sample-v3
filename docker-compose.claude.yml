# コンテナ内で Claude Code を使うときだけ重ねる override。
# ホストの ~/.claude（認証情報）をマウントするため、既定の compose には含めない。
# 使い方: ラッパー経由で `WITH_CLAUDE=1 ./scripts/docker-dev.sh shell`
# メイン・worktree とも読み取り専用でマウントする。コンテナ内のプロセスから
# ホストの ~/.claude（settings.json の hook 等）を書き換えられ、次回ホストで Claude Code を
# 起動したときに実行される経路を塞ぐため。コンテナ内の Claude Code は設定や履歴を書き込めない
services:
  dev:
    volumes:
      - ~/.claude:/home/devuser/.claude:ro
