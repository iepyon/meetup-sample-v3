# ⚠ このファイルは pocket-modeling リポジトリの同名ファイルの 2026-07-12 時点スナップショット。
# 原本は dmlctl（EventStorming facilitator スキル）が管理する。本リポジトリでは
# docs/issues-20260712.md および docs/wiki/ の参照用（読み取り専用）として保持している。
# 更新するときは原本（pocket-modeling 側）を dmlctl で編集し、このスナップショットを取り直す。

# =============================================================================
# DML テンプレート — 新規 EventStorming セッション
# =============================================================================
# このファイルを `docs/eventstorming/eventstorming-YYYYMMDD-HHMM.dml.yaml` に
# コピーし、必要なセクションのコメントを外しながら埋めていく。
#
# .md は廃止。HTML（dist/eventstorming/*.html）は本 YAML のみから自動生成される。
# AI は `scripts/dmlctl.py view/set/add` を介して必要な観点だけを読み書きする。
#
# 構文検証: `python3 scripts/validate_dml.py <this>.dml.yaml`
# 詳細仕様: `references/dml-spec.md` / `references/dml.schema.yaml`
#
# 全フィールドは optional。空 YAML（{} のみ）でも valid（進行中セッション許容）。
# =============================================================================

# ---------- (A) セッションメタ（旧 .md ヘッダー） ----------
# session:
#   id: eventstorming-YYYYMMDD-HHMM
#   domain: <ドメイン名>                    # 例: trade-in-exchange
#   phase: "1"                               # v7・直近完了フェーズ（構造化）。
#                                            # enum: "1" "2" "3" "4" "4.5" "4.6" "5" "6" "7"
#                                            # HTML タブハイライトはこれを最優先で参照する。
#                                            # 未設定の場合は status 文字列を regex 解釈するレガシー挙動。
#   status: Phase 1 (スコープ確認中)          # 補足説明（自由文字列）。タブには使われない
#   goal: <このセッションのゴール>
#   started_at: YYYY-MM-DDTHH:MM:00+09:00
#   html_link: ../../dist/eventstorming/eventstorming-YYYYMMDD-HHMM.html

# ---------- (B) Narratives（ハッピーパス + 代替シナリオの単一情報源） ----------
# narratives は HTML §1「ストーリー」と §2 フロー図駆動の単一情報源（v8）。
# 旧トップレベル `story:` キーは廃止。ハッピーパスは kind: happy のエントリとしてここに書く。
# `entry` を指定したエントリだけが §2 フロー図に 1 行描画される。
# kind は必須・enum: [happy, alt]、kind:happy は 0 or 1 件（narrative_happy_unique で検出）。
# narratives:
#   - id: happy                              # フロー識別子（lowercase-with-hyphen）
#     title: ハッピーパス
#     kind: happy                            # 必須・happy / alt
#     entry: <フロー開始 scenario.name>
#     prose: |
#       <ハッピーパス散文（400〜600 字）。{{主人公}}は {{課題}} を抱えていた…で始める。
#        実装詳細（CMD/AGG/POLICY 名）は描かない。>
#   - id: alt-1
#     title: <代替シナリオの短い題>
#     kind: alt
#     entry: <フロー開始 scenario.name>      # 任意。指定なし → §2 フロー図は省略・散文のみ
#     prose: |
#       <代替シナリオの散文（100〜200字）>

# ---------- (D) ドメイン分類（任意） ----------
# subdomain.type は CORE_SUBDOMAIN / SUPPORTING_SUBDOMAIN / GENERIC_SUBDOMAIN を推奨。
# 旧表記 CORE_DOMAIN / SUPPORTING_DOMAIN も後方互換で許容。
# domains:
#   - name: <domain-slug>
#     vision: <ドメインビジョン>
#     subs:
#       - { name: <subdomain-slug>, type: CORE_SUBDOMAIN, vision: ... }

# ---------- (E) Bounded Context ----------
# name / lang（語彙の英→日辞書）/ up / dn / description（旧 .md §7 散文）
# contexts:
#   - name: <bc-slug>                       # lowercase-with-hyphen
#     type: FEATURE                         # FEATURE / APPLICATION / SYSTEM / MICROSERVICE
#     description: |                         # 旧 .md §7：境界の理由 / 含むシナリオ / 目的 / 背景 / 制約
#       <BC 散文>
#     lang:
#       aggs:   { AggName: "集約日本語名" }
#       actors: { ActorName: "アクター日本語名" }
#       cmds:   { CommandName: "コマンド日本語名" }
#       evts:   { EventName: "イベント日本語名" }
#       pols:   { PolicyName: "ポリシー日本語名" }
#       qrys:   { QryName: "クエリ日本語名" }
#       vos:    { ValueObjName: "値オブジェクト日本語名" }
#     up: []                                # upstream BC
#     dn: []                                # downstream BC（{ ctx, rel: Customer-Supplier, ... }）
#     aggs: []                              # 所属 AGG 名の軽量名簿（PascalCase 文字列）

# ---------- (F) Aggregate（トップレベル詳細定義） ----------
# 新規 aggregates を追加するときは、所属 BC の `contexts[].lang.aggs` にも英→日辞書
# エントリを同時追加する（`contexts[].aggs` の軽量名簿とは別物。language_coverage で検出可能）。
# transitions[].from は実在状態のみ（schema が `^[A-Z][A-Z0-9_]*$` を強制）。
# AGG の生成（creation）は transitions に書かず、states[] 先頭の入口状態として
# 表現する（scenarios[].agg + lang.cmds で creation CMD は紐づけ済）。
# 入口で分岐する場合は「入口受付ステート」（例: APPLIED）を導入し
# `{ from: APPLIED, to: [ACCEPTED, WAITLISTED], via: <CreationCmd> }` のように
# to をリストにする。詳細は dml-spec.md「transitions[] の初期化規約」を参照。
# state_reachability チェックは states[0] を入口とみなし、それ以外はいずれかの
# to で到達可能でなければ違反として報告する。
#
# aggregates:
#   - name: <AggName>
#     ctx: <bc-slug>
#     purpose: <30 字以上で「この AGG が単一に責任を持つこと」を一文に>
#     background: <なぜ今この AGG を切り出すか>
#     constraints:
#       - <業務 / 法令 / プラットフォーム制約>
#     states: [DRAFT, FINAL]                  # DRAFT が入口（transitions に書かない）
#     transitions:
#       - { from: DRAFT, to: FINAL, via: <CommandName> }
#       # 単一状態のみで終わる AGG は `transitions: []`（空配列）を明示
#     attrs:
#       - { name: <fieldName>, type: <type>, required: true }
#     events:
#       - name: <EventName>
#         params:
#           - { name: <fieldName>, type: <type> }
#         # 終端 EVT（後段で参照されない結果イベント）には terminal: true を付け、
#         # orphan_event 検出から除外する。

# ---------- (G) Scenario（CMD 実行ユースケース） ----------
# 新規 scenarios を追加するときは、同 BC の `contexts[].lang.cmds` と `contexts[].lang.evts`
# にも英→日辞書エントリを同時追加する（dmlctl check --check=language_coverage で検出可能）。
# scenarios:
#   - name: <アクター + 行為（日本語）>
#     ctx: <bc-slug>
#     actor: <ActorName>
#     cmd: <CommandName>
#     evt: <EventName>
#     agg: <AggName>
#     next: <次の scenarios[].name>          # フロー連鎖：全フロー共通の次（任意）
#     # next:                                # 分岐点では dict 形式：narratives[].id ごとの次
#     #   happy: <次 scenario.name>
#     #   alt-1: <別 scenario.name>
#     rules:
#       - { rule: <英語の不変条件>, why: <なぜそれを守るか> }
#     errs:
#       - { cond: <エラー条件>, err: <ErrorName>, when: <発生時の補足> }
#     # 分岐 brs[] 使用時:
#     # brMode: exclusive
#     # brs:
#     #   - { cond: "...", evt: <HappyEvt> }                            # 通常分岐
#     #   - { cond: "...", evt: <AltEvt>, terminal: alt-X }             # この分岐が alt-X を終端
#     #   - { cond: "...", evt: <DivergeEvt>, next: <分岐先 scenario.name> }  # alt 経路の起点

# ---------- (H) Policy（EVENTUAL-TX） ----------
# 新規 policies を追加するときは、所属 BC の `contexts[].lang.pols` にも英→日辞書
# エントリを同時追加する（language_coverage で検出可能）。
# 複数トリガーは trgs（mode: all=AND join / any|or=OR）。遅延許容 SLA は within（例「火金の週2回」）。
# policies:
#   - name: <PolicyName>
#     ctx: <bc-slug>
#     trg: <EventName>                     # 単一トリガー（複数の場合 trgs を使う）
#     cmd: <CommandName>                   # 副作用専用 POLICY なら省略可
#     evt: <EventName>                     # 完了イベント名（任意）
#
# bulk: true の例（ファンアウト = 1 イベント受信時に N エンティティへ展開）：
#   - name: NotifyOnCancellation
#     ctx: notification
#     trg: MeetupCancelled
#     bulk: true                          # bulk: true のとき qry が必須（schema 検証）
#     qry: ActiveRsvpsForMeetup           # 送信対象リストを返すクエリ名
#
# 複数トリガーの join（`trgs`）例：
#   - name: GoodsReceivedJoin
#     ctx: warehouse
#     trgs:
#       evts: [ParcelArrived, InspectionScheduled]
#       mode: all                         # all（AND join） / any（OR）
#     cmd: ConfirmReadyForInspection

# ---------- (I) Flow（v6: 廃止） ----------
# トップレベル flows[] は廃止。フロー情報は次の 3 か所に分散して保持される：
#   - フロー識別子 / 見出し / 種別 / 散文 → narratives[]（上記 (B)）
#   - フロー連鎖（順序） → scenarios[].next（上記 (G)）
#   - 分岐終端          → scenarios[].brs[].terminal（上記 (G)）
# §2 フロー図は narratives[].entry を起点に builder が自動構成する。

# ---------- (J) 意思決定ログ（旧 .md §6） ----------
# decisions:
#   - id: D1
#     topic: <意思決定のテーマ>
#     chosen: <採用オプション名（options[].name のいずれかと一致）>
#     options:
#       # name: 追跡用 ID（英語 slug 推奨）。label: HTML 表示用の日本語ラベル（任意）
#       - { name: <opt-1>, label: <日本語ラベル>, adopted: true,  why: <採用理由> }
#       - { name: <opt-2>, label: <日本語ラベル>, adopted: false, why_not: <不採用理由> }
#     affects: [<関連 AGG/BC 名>]

# ---------- (K) オープンクエスチョン（旧 .md §5） ----------
# questions:
#   - id: Q1
#     topic: <確認したい事項>
#     why: <決まると何が変わるか>
#     status: open                          # open | closed
#     # decision_id: D1                      # closed の場合

# ---------- (L) 次のアクション（旧 .md §4） ----------
# actions:
#   - id: A1
#     text: <ステークホルダー向けに何をすればよいか>
#     owner: <担当者（任意）>

# ---------- (M) リードモデル候補（旧 .md §9） ----------
# queries:
#   - name: <QryName>
#     ctx: <bc-slug>
#     purpose: <何を確認して何を決めるか>
#     users: <利用者（アクター / ポリシー）>
#     sources:
#       - <ソース AGG / EVT 等>
#     formula: <算出条件・絞り込み式>

# =============================================================================
# 上記をすべてコメントアウトしているので、本ファイルそのものは valid な空 DML。
# 必要なセクションからコメントを外して埋めていく。
# =============================================================================
session:
  id: meetup-20260712
  domain: meetup-community-event
  phase: '7'
  status: 'Phase 7 完了: 構造 18/19 clean（残 2 件は D6 意図的許容）・意味チェック 6 観点実施・所見反映済み'
  html_link: ../../dist/eventstorming/meetup-20260712.html
  goal: 参加申込〜承認〜キャンセル〜繰り上げの参加ライフサイクルと、出来事起点の通知全体（参加確定・リマインダー・中止・繰り上げ・アンケート）の因果を一枚のフローに可視化する。コミュニティ運営は「申込者はコミュニティメンバー」という背景前提に留め、アンケート回答の集計・課金決済は対象外
narratives:
  - id: happy
    title: ハッピーパス — イベント企画から開催・アンケートまで
    kind: happy
    prose: "主催者はタイトル・開催日時・開催形式（オンライン/会場/ハイブリッド）・定員を決めてイベントを下書きとして作成する。この時点では誰にも見えない。内容が固まったら主催者が公開の操作を行い、コミュニティのメンバーが申し込めるようになる。参加者は公開されたイベントに参加申込をし、定員に空きがあれば「申込済み」として受け付けられる。主催者は申込一覧を確認し、まとめて承認する。承認された参加者には「参加が確定しました」の通知が届く。開催日が近づくと、システムが自動で対象イベントを検知し、承認済みの参加者全員へリマインダーを送る（前日目安）。当日、参加者は会場受付でチェックインし、来場の記録が残る。イベントが終わると主催者がイベントを「終了」にし、この操作をきっかけに承認済み参加者全員へアンケート依頼が自動送信される。\n"
    entry: 主催者がイベントを作成する
  - id: alt-waitlist
    title: 代替 — 満席申込とキャンセル発生時の自動繰り上げ
    kind: alt
    prose: "満席のイベントに申し込むと、その場で「キャンセル待ち」として申込順に登録される。参加確定者がキャンセルすると本人は「キャンセル済み」になり、それをきっかけに主催者へ「参加キャンセルが出ました」通知が飛び、同時にキャンセル待ち先頭が自動で参加確定に繰り上がる（主催者の再承認は不要）。繰り上がった本人にだけ確定通知が届く（主催者への繰り上げ通知は意図的に送らない）。\n"
    entry: 参加者が参加申し込みをする
  - id: alt-cancel-event
    title: 代替 — 開催前のイベント中止
    kind: alt
    prose: "公開中でまだ開催日前のイベントのみ中止できる（開催日を過ぎたものは「終了」で閉じる）。主催者が中止の操作をするとイベントは中止状態になり、申込済み・参加確定・キャンセル待ちの全員へ中止のお知らせが自動で飛ぶ（D4）。当日会場に来てしまう事故を避けるため即時・全員が原則。文面は状態別に出し分けない。\n"
    entry: 主催者がイベントを中止する
  - id: alt-edit
    title: 代替 — 公開後のイベント編集
    kind: alt
    prose: "下書き中と公開中のイベントは編集できる（会場変更・タイポ修正など）。定員・日時のチェックは作成時と同じものがかかる。終了済み・中止済みは記録なので編集不可。編集しても参加者へ変更通知が自動で飛ぶ仕組みは無く、会場変更時は主催者が手動で周知しているのが実情。\n"
    entry: 主催者がイベントを編集する
questions:
  - id: Q1
    topic: 中止通知の宛先に「承認前（申込済み）」の参加者を含めるか
    why: 現運用は参加確定＋キャンセル待ちのみが宛先で、承認前の申込者が漏れている疑いをエキスパート自身が指摘（T5）
    status: closed
    decision_id: D4
  - id: Q2
    topic: 公開後のイベント編集時に参加者へ変更通知を自動送信するか
    why: 現状は主催者の手動周知。会場変更の見落としリスクがある（T5）。今回のスコープでは通知一覧の完全性に関わる
    status: closed
    decision_id: D5
  - id: Q3
    topic: 「定員は確定者数を下回れない」ルールの導入と、既に超過しているイベントの繰り上げ挙動
    why: 現行は確定 30 名のイベントを定員 20 に編集できてしまう（T8）。超過状態では満席判定が狂い、キャンセル発生時の自動繰り上げが超過をさらに膨らませる。エキスパートは絶対ルール化を希望
    status: closed
    decision_id: D3
  - id: Q4
    topic: イベント中止後の参加レコードの後始末（一括取消するか・キャンセル待ち列をクリアするか）
    why: 中止のお知らせは飛ぶが Participation は生きたまま残る（意味チェック saga 所見）。一括取消を導入すると ParticipationCancelled 連発→繰り上げ暴発の連鎖リスクがあり、ガード設計とセットで要検討
    status: open
  - id: Q5
    topic: 一括承認で承認されなかった申込（否認・保留）の扱い
    why: 否認イベント・通知が未定義で、承認されない申込者は申込済みのまま宙に浮く（意味チェック所見）。開催日まで放置される体験の要否を確認したい
    status: open
contexts:
  - name: community
    note: 背景 BC（今回スコープ外）。「イベントに申し込む人はそのコミュニティのメンバーである」前提を供給する。メンバー（Member）概念はスコープ外のため lang 名簿から除外し、participation/checkin では役割名 Participant（参加者）として分離（bc_vocabulary_collision 解消・Conformist 的流用）
    lang:
      actors:
        Organizer: 主催者
    up: []
    dn:
      - ctx: event
        rel: Customer-Supplier
        roles:
          - U
        prRoles:
          - D
        note: イベントはコミュニティ配下で開催される
      - ctx: participation
        rel: Customer-Supplier
        roles:
          - U
        prRoles:
          - D
        note: 申込者はメンバーである前提を供給
    description: '**背景 BC（今回スコープ外）**。コミュニティの立ち上げ・メンバーの加入申請・承認・却下・脱退を扱う。今回のモデルには「イベントに申し込む人はそのコミュニティのメンバーである」という前提だけを供給する。運用は安定しており今回は境界の意識のみ（T2, T6）。'
    sub: community-foundation
  - name: event
    lang:
      actors:
        Organizer: 主催者
        System: システム
      cmds:
        CreateEvent: イベントを下書き作成する
        PublishEvent: イベントを公開する
        UpdateEvent: イベントを編集する
        CloseEvent: イベントを終了する
        CancelEvent: イベントを中止する
        CheckUpcomingEvents: 開催日接近をチェックする
      evts:
        EventCreated: イベントが下書き作成された
        EventPublished: イベントが公開された
        EventUpdated: イベントが編集された
        EventClosed: イベントが終了された
        EventCancelled: イベントが中止された
