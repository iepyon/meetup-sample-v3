      qrys:
        FindUpcomingEvents: リマインダー対象の開催間近イベント一覧
      states:
        DRAFT: 下書き
        PUBLISHED: 公開中
        CLOSED: 終了済
        CANCELLED: イベント中止済
      vos:
        Capacity: 定員
        EventFormat: 開催形式（オンライン/会場/ハイブリッド）
      aggs:
        Event: イベント
    up:
      - ctx: community
        rel: Customer-Supplier
        roles:
          - D
        prRoles:
          - U
    dn:
      - ctx: participation
        rel: Customer-Supplier
        roles:
          - U
          - OHS
        prRoles:
          - D
          - CF
      - ctx: notification
        rel: Customer-Supplier
        roles:
          - U
        prRoles:
          - D
          - CF
    description: "イベントの **下書き・公開・編集・終了・中止** というライフサイクルを主催者の意思で完結させる文脈。開催日接近の時間駆動検知（スケジューラ）もイベントの状態を読むためここに置く。\n- **目的**: 主催者が開催準備を下書きから安全に進め、公開・終了・中止の節目を明確にする\n- **制約**: 終了は公開中のみ／中止は公開中かつ開催日前のみ／編集は下書き・公開中のみ"
    sub: event-lifecycle
    aggs:
      - Event
  - name: participation
    lang:
      actors:
        Participant: 参加者
        Organizer: 主催者
        System: システム
      cmds:
